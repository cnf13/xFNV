# Generated by harness/tools/deinline.py rules from ruleset.py; edit there.
id: "hkvector4-dot3"
language: "cpp"
message: "hkVector4::dot3 written out in SSE (the product, then lane z + (lane y + lane x)): the result feeds a float or a quad and the product local may be reused"
severity: "hint"
rule:
  kind: "declaration"
  has:
    stopBy: "end"
    any:
      -
        pattern: "_mm_cvtss_f32(_mm_add_ss(_mm_shuffle_ps($T, $T, 0xAA), _mm_add_ss(_mm_shuffle_ps($T, $T, 0x55), $T)))"
      -
        pattern: "_mm_cvtss_f32(_mm_add_ss(_mm_shuffle_ps($T, $T, _MM_SHUFFLE(2, 2, 2, 2)), _mm_add_ss(_mm_shuffle_ps($T, $T, _MM_SHUFFLE(1, 1, 1, 1)), $T)))"
  follows:
    stopBy: "neighbor"
    any:
      -
        pattern: "const __m128 $T = _mm_mul_ps($A.m_quad, $B.m_quad);"
      -
        pattern: "__m128 $T = _mm_mul_ps($A.m_quad, $B.m_quad);"
