              pattern: "$T* $OLD = $SP.m_pObject;"
          -
            regex: "[\\s\\S]"
            follows:
              stopBy: "neighbor"
              kind: "comment"
              regex: "EXE-INLINED|EXE-CALLED|SWEEP-INLINE"
              follows:
                stopBy: "neighbor"
                pattern: "$T* $OLD = $SP.m_pObject;"
fix: ""
