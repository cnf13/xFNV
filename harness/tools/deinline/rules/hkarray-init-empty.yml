# Generated by harness/tools/deinline.py rules from ruleset.py; edit there.
id: "hkarray-init-empty"
language: "cpp"
message: "hkArray<T>'s default constructor written out on raw storage (null data, size 0): the array's whole life (construction and the free) is rewritten together"
severity: "hint"
rule:
  pattern: "$A.m_data = nullptr;"
  all:
    -
      regex: "[\\s\\S]"
      any:
        -
          regex: "[\\s\\S]"
          precedes:
            stopBy: "neighbor"
            pattern: "$A.m_size = 0;"
        -
          regex: "[\\s\\S]"
          precedes:
            stopBy: "neighbor"
            kind: "comment"
            regex: "EXE-INLINED|EXE-CALLED|SWEEP-INLINE"
            precedes:
              stopBy: "neighbor"
              pattern: "$A.m_size = 0;"
