id: "hk-monitor-add-value-raw"
language: "cpp"
message: "HK_MONITOR_ADD_VALUE written out (raw command) in a block of its own"
severity: "hint"
rule:
  kind: "compound_statement"
  all:
    -
      has:
        nthChild:
          position: 1
          ofRule:
            not:
              kind: "comment"
        pattern: "hkMonitorStream& $S = hkMonitorStream::getInstance();"
    -
      has:
        nthChild:
          position: 2
          ofRule:
            not:
              kind: "comment"
        kind: "if_statement"
        all:
          -
            regex: "[\\s\\S]"
            has:
              field: "condition"
              has:
                field: "value"
                pattern: "$S.m_end < $S.m_capacityMinus16"
          -
            not:
              has:
                field: "alternative"
                regex: "[\\s\\S]"
          -
            has:
              field: "consequence"
              kind: "compound_statement"
              all:
                -
                  has:
                    nthChild:
                      position: 1
                      ofRule:
                        not:
                          kind: "comment"
                    pattern: "*reinterpret_cast<const char**>($S.m_end) = $STR;"
                -
                  has:
                    nthChild:
                      position: 2
                      ofRule:
                        not:
                          kind: "comment"
                    pattern: "*reinterpret_cast<float*>($S.m_end + 4) = $V;"
                -
                  has:
                    nthChild:
                      position: 3
                      ofRule:
                        not:
                          kind: "comment"
                    pattern: "$S.m_end += 8;"
                -
                  not:
                    has:
                      nthChild:
                        position: 4
                        ofRule:
                          not:
                            kind: "comment"
                      regex: "[\\s\\S]"
    -
      not:
        has:
          nthChild:
            position: 3
            ofRule:
              not:
                kind: "comment"
          regex: "[\\s\\S]"
constraints:
  STR:
    regex: "^\"Mi"
transform:
  NAME:
    replace:
      source: "$STR"
      replace: "^\".."
      by: "\""
fix: "HK_MONITOR_ADD_VALUE($NAME, $V, HK_MONITOR_TYPE_INT);"
