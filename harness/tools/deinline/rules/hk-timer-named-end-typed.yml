# Generated by harness/tools/deinline.py rules from ruleset.py; edit there.
id: "hk-timer-named-end-typed"
language: "cpp"
message: "the timer macro HK_TIMER_NAMED_END written out (typed command) in a block of its own"
severity: "hint"
rule:
  kind: "compound_statement"
  all:
    -
      has:
        nthChild:
          position: 1
          ofRule:
            not:
              kind: "comment"
        pattern: "hkMonitorStream& $S = hkMonitorStream::getInstance();"
    -
      has:
        nthChild:
          position: 2
          ofRule:
            not:
              kind: "comment"
        kind: "if_statement"
        all:
          -
            regex: "[\\s\\S]"
            has:
              field: "condition"
              has:
                field: "value"
                pattern: "$S.m_end < $S.m_capacityMinus16"
          -
            not:
              has:
                field: "alternative"
                regex: "[\\s\\S]"
          -
            has:
              field: "consequence"
              kind: "compound_statement"
              all:
                -
                  has:
                    nthChild:
                      position: 1
                      ofRule:
                        not:
                          kind: "comment"
                    any:
                      -
                        pattern: "auto* $H = reinterpret_cast<hkMonitorStream::TimerCommand*>($S.m_end);"
                      -
                        pattern: "hkMonitorStream::TimerCommand* $H = reinterpret_cast<hkMonitorStream::TimerCommand*>($S.m_end);"
                -
                  has:
                    nthChild:
                      position: 2
                      ofRule:
                        not:
                          kind: "comment"
                    pattern: "$H->m_commandAndMonitor = $STR;"
                -
                  has:
                    nthChild:
                      position: 3
                      ofRule:
                        not:
                          kind: "comment"
                    pattern: "$H->m_time0 = static_cast<uint32_t>($RDTSC());"
                -
                  has:
                    nthChild:
                      position: 4
                      ofRule:
                        not:
                          kind: "comment"
                    any:
                      -
                        pattern: "$S.m_end = reinterpret_cast<char*>($H + 1);"
                      -
                        pattern: "$S.m_end += 12;"
                -
                  not:
                    has:
                      nthChild:
                        position: 5
                        ofRule:
                          not:
                            kind: "comment"
                      regex: "[\\s\\S]"
    -
      not:
        has:
          nthChild:
            position: 3
            ofRule:
              not:
                kind: "comment"
          regex: "[\\s\\S]"
constraints:
  STR:
    regex: "^\"Et[^\"]"
  RDTSC:
    regex: "^(__rdtsc|__builtin_ia32_rdtsc)$"
transform:
  NAME:
    replace:
      source: "$STR"
      replace: "^\".."
      by: "\""
fix: "HK_TIMER_NAMED_END($NAME);"
---
