                          pattern: "$TI $I = $A->m_usSize;"
          -
            regex: "[\\s\\S]"
            follows:
              stopBy: "neighbor"
              kind: "comment"
              regex: "EXE-INLINED|EXE-CALLED|SWEEP-INLINE"
              follows:
                stopBy: "neighbor"
                all:
                  -
                    kind: "if_statement"
